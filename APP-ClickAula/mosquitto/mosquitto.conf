# Configuración mínima de Mosquitto para ClickAula.
#
# Mosquitto 2.x, por defecto, sólo escucha en localhost y rechaza conexiones
# anónimas. Sin estas dos líneas ningún pulsador puede conectarse: es el
# tropiezo más común al montar el sistema.

listener 1883 0.0.0.0
allow_anonymous true

# La red del aula es cerrada y sin salida a internet, así que no usamos
# usuario ni contraseña. Si alguna vez se expone el broker a otra red, hay
# que poner allow_anonymous false y un archivo de contraseñas.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice
