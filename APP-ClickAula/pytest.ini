[pytest]
# `pythonpath = .` hace importables `dominio/`, `servicios/` y `app/` sin
# instalar el proyecto. `tests/` no es paquete a propósito: así pytest pone esa
# carpeta en el camino de importación y los tests pueden usar los dobles de
# `conftest.py` por nombre.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
