# DHCP de la red del aula. Sólo DHCP: la Pi no tiene salida a internet.

interface=wlan0
# bind-dynamic y no bind-interfaces: si dnsmasq arranca antes de que wlan0
# tenga dirección, la toma cuando aparece en lugar de fallar.
bind-dynamic

# Sin servidor DNS: nadie lo necesita, el broker se alcanza por IP.
port=0

# Concesiones cortas: los pulsadores entran y salen de la red todo el tiempo.
dhcp-range=192.168.4.10,192.168.4.200,255.255.255.0,15m
dhcp-authoritative

# Sin puerta de enlace ni DNS: un PC que además esté enchufado a otra red con
# internet no intenta salir por la Pi.
dhcp-option=3
dhcp-option=6
