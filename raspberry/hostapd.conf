# Punto de acceso de ClickAula. instalar.sh agrega al final el país, el canal,
# el nombre de la red y la clave, así la clave no queda en el repositorio.

interface=wlan0
driver=nl80211
ieee80211d=1

# El ESP8266 sólo habla 2,4 GHz, y la Zero W tampoco tiene otra banda.
hw_mode=g
ieee80211n=1
wmm_enabled=1

# Treinta pulsadores y el PC, con margen. El límite real lo pone el chip
# inalámbrico, no este número: ver CLAUDE.md, sección 10.
max_num_sta=40

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
