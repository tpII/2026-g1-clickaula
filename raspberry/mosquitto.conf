# Mosquitto de ClickAula en la Raspberry Pi. Debian ya trae en
# /etc/mosquitto/mosquitto.conf la persistencia en /var/lib/mosquitto y el
# registro en /var/log/mosquitto; acá va sólo lo propio del aula.
#
# Mosquitto 2.x, por defecto, sólo escucha en localhost y rechaza conexiones
# anónimas. Sin estas dos líneas ningún pulsador puede conectarse.

listener 1883
allow_anonymous true

# Sin usuario ni contraseña: riesgo evaluado y aceptado, CLAUDE.md sección 10.
